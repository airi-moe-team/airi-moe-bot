[project]
name = "airi"
version = "0.1.0"
description = "Bot de Discord con LLM local (Airi) — arquitectura hexagonal"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3,<3",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
airi = "airi.__main__:main"
airi-trace = "airi.observability.cli:main"
airi-replay = "airi.observability.replay:main"
airi-prompt-benchmark = "airi.observability.prompt_benchmark:main"
airi-reasoning-sweep = "airi.observability.reasoning_sweep:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" habilita el paquete airi (src/ layout).
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
